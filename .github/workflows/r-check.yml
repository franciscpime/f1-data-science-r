name: R Project Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c("tidyverse", "jsonlite", "slider", "rpart", "car", "lmtest"))'

      - name: Check R syntax
        run: |
          find . -name "*.R" -not -path "./.git/*" -exec Rscript -e 'parse(file = commandArgs(TRUE)[1])' {} \;    